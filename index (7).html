<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى قطتي الجميلة 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff8fa3;
            --secondary-color: #ff4d6d;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
            min-height: 100vh;
        }

        /* صفحة تسجيل الدخول - خلفية أتاري */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://wallpaperaccess.com/full/2316025.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center; align-items: center;
            z-index: 1000;
            transition: 1s;
        }

        .login-box {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px; border-radius: 30px;
            text-align: center; border: 2px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(255, 143, 163, 0.5);
            color: white;
        }

        input[type="password"] {
            padding: 12px; border-radius: 25px; border: none;
            width: 220px; text-align: center; font-size: 18px; margin-top: 15px;
        }

        .login-box button {
            display: block; margin: 20px auto 0;
            padding: 10px 40px; border-radius: 20px; border: none;
            background: var(--secondary-color); color: white;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }

        /* المحتوى الرئيسي */
        #main-content {
            display: none; text-align: center;
            padding: 20px; animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* خلفيات متغيرة حسب اليوم */
        .bg-sunday { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
        .bg-monday { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .bg-tuesday { background: linear-gradient(135deg, #d4fc79, #96e6a1); }
        .bg-wednesday { background: linear-gradient(135deg, #f6d365, #fda085); }
        .bg-thursday { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
        .bg-friday { background: linear-gradient(135deg, #cfd9df, #e2ebf0); }
        .bg-saturday { background: linear-gradient(135deg, #a6c0fe, #f68084); }

        /* العداد */
        .counter-card {
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px);
            margin: 20px auto; padding: 25px; border-radius: 20px;
            max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #counter { font-size: 22px; font-weight: bold; color: #444; }

        /* شبكة الصور */
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px; max-width: 800px; margin: 40px auto;
        }

        .photo-box {
            position: relative; aspect-ratio: 1; background: white;
            border-radius: 15px; cursor: pointer; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.4s;
        }

        .photo-box img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0; transition: 0.6s ease-in-out; transform: scale(1.3);
        }

        .photo-box.reveal img { opacity: 1; transform: scale(1); }
        .photo-box::before { content: "🐾"; position: absolute; top: 40%; left: 45%; font-size: 30px; opacity: 0.5; }
        .photo-box.reveal::before { display: none; }

        .video-container {
            max-width: 500px; margin: 40px auto; border-radius: 20px;
            overflow: hidden; border: 5px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        #gift-section { margin: 60px 0; padding-bottom: 50px; }
        .gift-box { font-size: 80px; cursor: pointer; transition: 0.4s; display: inline-block; }
        .gift-box:hover { transform: scale(1.2) rotate(15deg); }
        .hidden-msg { display: none; margin-top: 20px; font-size: 24px; color: #d00; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ملف الصوت الأساسي -->
    <audio id="welcome-voice">
        <source src="welcome.mp3" type="audio/mpeg">
    </audio>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-overlay">
        <div class="login-box">
            <h2 style="font-family: 'Dancing Script', cursive; font-size: 35px;">Hello Kitty! 🐈‍⬛</h2>
            <p>ادخلي كلمة السر السرية</p>
            <input type="password" id="pass-input" placeholder="Password...">
            <button onclick="checkPass()">دخول ✨</button>
        </div>
    </div>

    <!-- المحتوى بعد الدخول -->
    <div id="main-content">
        <div class="counter-card">
            <h2 style="margin-top:0;">إحنا مع بعض بقالنا:</h2>
            <div id="counter"></div>
        </div>

        <h3 style="margin-top: 40px;">ذكرياتنا (دوسي على المربعات) 📸</h3>
        <div class="grid-container">
            <div class="photo-box" onclick="reveal(this)"><img src="https://picsum.photos/400/400?random=1"></div>
            <div class="photo-box" onclick="reveal(this)"><img src="https://picsum.photos/400/400?random=2"></div>
            <div class="photo-box" onclick="reveal(this)"><img src="https://picsum.photos/400/400?random=3"></div>
            <div class="photo-box" onclick="reveal(this)"><img src="https://picsum.photos/400/400?random=4"></div>
            <div class="photo-box" onclick="reveal(this)"><img src="https://picsum.photos/400/400?random=5"></div>
            <div class="photo-box" onclick="reveal(this)"><img src="https://picsum.photos/400/400?random=6"></div>
        </div>

        <div style="margin: 40px 0;">
            <h3>رسالة صوتية لكِ 🎙️</h3>
            <audio controls style="width: 280px;">
                <source src="voice-msg.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="video-container">
            <h3>فيديو مخصص لأميرتي 🎬</h3>
            <video width="100%" controls>
                <source src="your-video.mp4" type="video/mp4">
            </video>
        </div>

        <section id="gift-section">
            <h3>اضغطي على الهدية 🎁</h3>
            <div class="gift-box" onclick="openGift()">🎁</div>
            <div id="gift-status" style="margin-top:10px; color: #666;">افتحيها الآن!</div>
            <div id="gift-msg" class="hidden-msg">بحبك يا قطتي ❤️</div>
        </section>
    </div>

    <script>
        // --- الإعدادات الخاصة ---
        const CORRECT_PASS = "1234"; 
        const START_DATE = new Date("October 10, 2023 00:00:00").getTime(); 
        const WHATSAPP_PHONE = "201114689409"; 
        const CALLMEBOT_API_KEY = "4916351"; 
        // -----------------------

        function checkPass() {
            const input = document.getElementById('pass-input').value;
            if(input === CORRECT_PASS) {
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    
                    // تشغيل صوت "نورتي يا قطتي"
                    const audio = document.getElementById('welcome-voice');
                    audio.play().catch(e => console.log("الصوت يحتاج تفاعل"));
                    
                    setDayBackground();
                    startCounter();
                }, 1000);
            } else {
                alert("كلمة السر غلط يا قطتي 🐈");
            }
        }

        function setDayBackground() {
            const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const today = days[new Date().getDay()];
            document.body.className = 'bg-' + today;
        }

        function startCounter() {
            setInterval(function() {
                const diff = new Date().getTime() - START_DATE;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById("counter").innerHTML = d + " يوم، " + h + " ساعة، " + m + " دقيقة، " + s + " ثانية";
            }, 1000);
        }

        function reveal(el) {
            el.classList.add('reveal');
        }

        function openGift() {
            document.getElementById('gift-msg').style.display = 'block';
            document.querySelector('.gift-box').innerHTML = '💖';
            document.getElementById('gift-status').innerText = "تم إرسال إشعار لي! 😉";

            // إرسال رسالة واتساب لك تلقائياً
            const message = encodeURIComponent("انا فتحت الهديه وحلوه زيك");
            const url = `https://api.callmebot.com/whatsapp.php?phone=${WHATSAPP_PHONE}&text=${message}&apikey=${CALLMEBOT_API_KEY}`;
            
            fetch(url, { mode: 'no-cors' });
        }
    </script>
</body>
</html>
