<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hassan & Hana</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0050;
            --glass: rgba(0, 0, 0, 0.7);
            --border-color: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://i.ibb.co/qYZb6KZS/image.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; overflow-x: hidden;
        }

        #lock-screen {
            position: fixed; inset: 0; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://i.ibb.co/qYZb6KZS/image.jpg');
            background-size: cover; z-index: 10000; display: flex; justify-content: center; align-items: center;
            transition: transform 0.8s ease-in-out;
        }

        .lock-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px; border-radius: 35px; text-align: center; width: 85%; max-width: 380px;
            border: 1px solid var(--border-color);
        }

        #main-app { display: none; max-width: 600px; margin: 0 auto; padding: 20px; }

        .memory-card {
            background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 30px; margin-bottom: 30px; border: 1px solid var(--border-color);
            overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .media-stack { display: flex; flex-direction: column; gap: 2px; background: #000; }
        .media-stack img, .media-stack video { width: 100%; display: block; max-height: 70vh; object-fit: contain; }

        .memory-body { padding: 20px; }
        .date-badge { background: var(--primary); color: white; padding: 5px 15px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        
        .music-bar {
            background: linear-gradient(90deg, #ff0050 0%, #ff5e62 100%);
            padding: 15px 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 25px; cursor: pointer;
        }
        .play-btn { background: white; color: var(--primary); width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; }

        .header-card { background: var(--glass); padding: 25px; border-radius: 25px; text-align: center; margin-bottom: 20px; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .timer-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 15px; border: 1px solid var(--primary); }
        .timer-box span { display: block; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-card">
            <span style="font-size: 50px;">🔐</span>
            <h2>Hassan & Hana</h2>
            <p>تاريخ يوم حبنا</p>
            <input type="text" id="pinCode" placeholder="افتكري يا ست البنات.." 
                   style="text-align: center; width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none;"
                   onkeypress="handleKeyPress(event)">
            <button onclick="unlock()" style="width: 100%; padding: 15px; background: var(--primary); border: none; color: white; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;">دخول</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header-card">
            <h1 style="margin:0">❤️ Hassan & Hana</h1>
            <div class="timer-grid">
                <div class="timer-box"><span id="d">0</span><label>يوم</label></div>
                <div class="timer-box"><span id="h">0</span><label>ساعة</label></div>
                <div class="timer-box"><span id="m">0</span><label>دقيقة</label></div>
                <div class="timer-box"><span id="s">0</span><label>ثانية</label></div>
            </div>
        </div>

        <div class="music-bar" onclick="togglePlay()">
            <button class="play-btn" id="playIcon">▶</button>
            <div style="flex-grow:1">
                <div style="font-weight: bold; font-size: 14px;">أغنيتنا المفضلة 🎵</div>
            </div>
            <audio id="audioTrack" loop>
                <source src="https://c.top4top.io/m_36695s4h40.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div id="feed"></div>
    </div>

    <script>
        // مصفوفة الذكريات
        let memories = [
            {
                id: 4,
                title: " احلي ايام ",
                date: "2025-01-18",
                desc: "گنت عاوزة اقولك بمناسبة أننا كملنا سنة مع بعض ويارب العمر كلو كل سنة وأنتى منوره حياتي ودنيتي وكل سنة وأنتى حبيبتي سنة عدت معاكى بحلوها ومرها وسنة هبتديها بيكى ويارب طول العمر وإنشاء الله مش اخر سنة لينا مع بعض وهنفضل مكملين لو الدنيا كلها وقعت أنا وأنتى هنفضل مكملين مع بعض وماسكين في أيد بعض حبيتك وحبيت ضحكتك اللي منورة حياتي ودنيتي بحبك وهفضل احبك العمر كلو لحد ما يجي الوقت اللي يبقي في الحب دا قدام الناس كلها أنتى هدية من ربنا بعتهالي هفضل محافظة عليها عمري كلو ومش هخلي حد يخدك مني وأنتى اللي عرفت معاها معني الحب ومعني الاهتمام ومعني الثقة وكل حاجة بجد أنتى بنتى واختى وصحبتى وحبيبتي ودنيتي واهلي وناسي وسندي وضهري نورة عيني من جوا كل سنة وأحنا بينا خناقات كتير ونكد كتير عاوزة أقولك أنك احسن وحده انا عرفتها ومتأكد أنك بتحبني ولازم تبقي عارف أنا بحبك قد أي أنا نفسي أشوفك احسن واحد في الدنيا كلها أنا بتباها بيكى بحبك وبحب رخامتك وبحب نكدك عليا والمقالب اللي بتعمليها فيا كتير بس في الاخر ماليش حد غيرك يابت هنفضل مع بعض العمر كلو وهنفضل قد وعدنا لبعض وأنا وعد مني هفضل علي قلبك ومربع كمان عايز أقولك أنا بحبك اووي فوق ما تتخيلى وهفضل احبك لحد ما اموت معرفتش الحب غير وانا معاك معرفتش يعني اي أخاف على حد ويبقي جزء من حياتي ونصي الثاني غير وأنا جمبك اتمنيت من ربنا بت أحبها ويتشيلني في عينيها وربنا استجاب مني وبعتك ليااا هفضل علي قد وعدي معاكى لأنك أمنية اتمنيتها والحمد لله لقيتك ف معنديش استعداد اخسرك ربنا يخليك ليا وميحرمنيش منك يارب ويجعلك من نصيبي ويجمعنا في بيت واحد يا كتكوتيي♥️♥️♥️♥️♥️♥️♥️😍",
                links: ["https://l.top4top.io/m_3669d3gml0.mp4"]
            },
            {
                id: 3,
                title: " احلي خروجه",
                date: "2025-01-18",
                desc: "يومي مبعدين فير بيكي ي ست البنات",
                links: ["https://l.top4top.io/m_366936j3m1.mp4"]
            },
            {
                id: 2,
                title: "اجمل لحظه",
                date: "2025-01-18",
                desc: "هنا كنت مكسوف وانتي كنتي قمر..",
                links: ["https://k.top4top.io/m_36697ebvg0.mp4"]
            },
            {
                id: 1,
                title: "بداية حكايتنا",
                date: "2025-01-18",
                desc: "أجمل يوم في حياتي",
                links: ["https://c.top4top.io/p_36694wtj20.jpg"]
            }
        ];

        const audio = document.getElementById('audioTrack');
        const startPoint = new Date("January 18, 2025 00:00:00").getTime();

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                unlock();
            }
        }

        function unlock() {
            const inputField = document.getElementById('pinCode');
            const code = inputField.value.trim();
            
            if(code === "20/1" || code === "٢٠/١") {
                audio.play().catch(e => console.log("Audio blocked"));
                document.getElementById('lock-screen').style.transform = "translateY(-100%)";
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    startTimer();
                    renderMemories();
                }, 800);
            } else { 
                alert("التاريخ خطأ! جربي مرة ثانية");
                inputField.value = "";
            }
        }

        function togglePlay() {
            if(audio.paused) { audio.play(); document.getElementById('playIcon').innerText = "⏸"; }
            else { audio.pause(); document.getElementById('playIcon').innerText = "▶"; }
        }

        function isVideo(url) {
            return url.toLowerCase().match(/\.(mp4|webm|ogg|mov|m4v)$/) != null;
        }

        function renderMemories() {
            const feed = document.getElementById('feed');
            feed.innerHTML = memories.map(m => {
                const mediaHtml = m.links.map(link => {
                    return isVideo(link) 
                        ? `<video src="${link}" controls playsinline preload="metadata"></video>` 
                        : `<img src="${link}" loading="lazy">`;
                }).join('');

                return `
                <div class="memory-card">
                    <div class="media-stack">${mediaHtml}</div>
                    <div class="memory-body">
                        <span class="date-badge">${m.date}</span>
                        <h3 style="margin:15px 0 10px 0">${m.title}</h3>
                        <p style="margin:0; opacity:0.8; line-height:1.6">${m.desc}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function startTimer() {
            function update() {
                const diff = new Date().getTime() - startPoint;
                document.getElementById('d').innerText = Math.floor(diff / 86400000);
                document.getElementById('h').innerText = Math.floor((diff % 86400000) / 3600000);
                document.getElementById('m').innerText = Math.floor((diff % 3600000) / 60000);
                document.getElementById('s').innerText = Math.floor((diff % 60000) / 1000);
            }
            update();
            setInterval(update, 1000);
        }
    </script>
</body>
</html>
