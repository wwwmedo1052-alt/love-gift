<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصتنا الجميلة ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #590d22;
            --bg-color: #1a1a2e;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: white;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* شاشة القفل */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: 0.8s ease-in-out;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            border: 1px solid rgba(255, 77, 109, 0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        input[type="password"] {
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 1.2rem;
            margin: 15px 0;
            width: 80%;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn:hover { transform: scale(1.05); background-color: #ff758f; }

        /* المحتوى الرئيسي */
        #main-content { display: none; padding: 20px; text-align: center; }

        .profile-img {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            margin-top: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }

        /* العداد الزمني */
        .timer-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 30px 0;
        }

        .timer-box {
            background: rgba(255, 77, 109, 0.2);
            padding: 15px 5px;
            border-radius: 15px;
            border: 1px solid var(--primary-color);
        }

        .timer-box span { display: block; font-size: 1.5rem; font-weight: bold; }
        .timer-box label { font-size: 0.8rem; opacity: 0.8; }

        /* كروت التواريخ (الفرح والخطوبة) */
        .event-card {
            background: linear-gradient(45deg, #590d22, #ff4d6d);
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            max-width: 400px;
            position: relative;
        }

        /* الصور */
        .photo-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .photo-card {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 15px;
        }

        .photo-card img {
            width: 100%;
            border-radius: 10px;
            max-height: 400px;
            object-fit: cover;
        }

        /* القلوب المتساقطة */
        .heart {
            position: fixed;
            color: var(--primary-color);
            top: -10%;
            z-index: -1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="login-box">
            <h2>أهلاً بكِ يا أميرتي ❤️</h2>
            <p>أدخلي كلمة السر لرؤية المفاجأة</p>
            <input type="password" id="passInput" placeholder="Password">
            <br>
            <button class="btn" onclick="checkPass()">افتحي القلب 😍</button>
            <p id="error" style="color: #ffccd5; font-size: 0.9rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="main-content">
        <img src="https://via.placeholder.com/150" class="profile-img" alt="صورة الزوجين">
        <h1>سارة & أحمد ❤️</h1>
        
        <div class="event-card">
            <h3>💍 يوم خطوبتنا</h3>
            <p>04 - 04 - 2021</p>
        </div>

        <div class="event-card">
            <h3>👰 يوم فرحنا</h3>
            <p>قريباً إن شاء الله</p>
        </div>

        <h3>لقد مر على حبنا:</h3>
        <div class="timer-container" id="timer">
            <div class="timer-box"><span id="days">0</span><label>يوم</label></div>
            <div class="timer-box"><span id="hours">0</span><label>ساعة</label></div>
            <div class="timer-box"><span id="minutes">0</span><label>دقيقة</label></div>
            <div class="timer-box"><span id="seconds">0</span><label>ثانية</label></div>
        </div>

        <div class="photo-gallery">
            <div class="photo-card">
                <img src="https://via.placeholder.com/400x500" alt="صورة 1">
                <p>يوم ما عرفنا بعض كان يوم ولادتي ❤️</p>
            </div>
            <div class="photo-card">
                <img src="https://via.placeholder.com/400x500" alt="صورة 2">
                <p>أجمل حاجة في حياتي هي إنتي 😍</p>
            </div>
        </div>

        <footer style="margin: 50px 0; opacity: 0.5;">
            صنع بكل حب لكِ ❤️
        </footer>
    </div>

    <script>
        // التحقق من كلمة السر
        function checkPass() {
            const pass = document.getElementById('passInput').value;
            if(pass.toLowerCase() === "love") {
                document.getElementById('lock-screen').style.transform = "translateY(-100%)";
                document.getElementById('main-content').style.display = "block";
                startTimer();
                createHearts();
            } else {
                document.getElementById('error').innerText = "كلمة السر غلط يا روحي! جربي 'love'";
            }
        }

        // العداد الزمني (عدل التاريخ هنا)
        function startTimer() {
            const startDate = new Date("April 4, 2021 00:00:00").getTime();

            setInterval(function() {
                const now = new Date().getTime();
                const distance = now - startDate;

                document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }, 1000);
        }

        // تساقط القلوب
        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = Math.random() * 3 + 2 + "s";
                heart.style.fontSize = Math.random() * 20 + 10 + "px";
                document.body.appendChild(heart);
                
                setTimeout(() => { heart.remove(); }, 5000);
            }, 300);
        }
    </script>
</body>
</html>
