<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0d0d0d;
    color: white;
    overflow-x: hidden;
}

/* خلفية القلوب */
.hearts {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}

.heart {
    position: absolute;
    color: red;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {transform: translateY(100vh); opacity: 1;}
    100% {transform: translateY(-10vh); opacity: 0;}
}

/* الكارت الرئيسي */
.container {
    position: relative;
    z-index: 1;
    padding: 20px;
}

/* صندوق المحادثة */
.chat {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
}

/* الرسائل */
.msg {
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    width: fit-content;
}

.me {
    background: #ff4d6d;
    margin-left: auto;
}

.you {
    background: #333;
}

/* الصور */
.gallery img {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
}

/* التواريخ */
.dates {
    text-align: center;
    margin-top: 20px;
    background: #111;
    padding: 15px;
    border-radius: 10px;
}

/* زر رفع الصور */
input {
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">

    <h2 style="text-align:center;">❤️ Our Love Story ❤️</h2>

    <div class="chat">
        <div class="msg you">فاكر أول يوم قابلنا بعض؟ 🥺</div>
        <div class="msg me">أحلى يوم في حياتي ❤️</div>
        <div class="msg you">بحبك جدا 😍</div>
        <div class="msg me">وأنا بعشقك ❤️❤️❤️</div>
    </div>

    <!-- إضافة صور -->
    <div class="gallery">
        <h3>📸 صورنا</h3>
        <input type="file" multiple onchange="addImages(event)">
        <div id="images"></div>
    </div>

    <!-- التواريخ -->
    <div class="dates">
        <h3>💍 مناسباتنا</h3>
        <p>يوم الخطوبة: <span id="engagement">--</span></p>
        <p>يوم الفرح: <span id="wedding">--</span></p>

        <input type="date" onchange="setDate('engagement', this.value)">
        <br>
        <input type="date" onchange="setDate('wedding', this.value)">
    </div>

</div>

<script>

// قلوب متحركة
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";

    document.getElementById("hearts").appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);

// إضافة صور
function addImages(event) {
    const container = document.getElementById("images");
    const files = event.target.files;

    for (let file of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.createElement("img");
            img.src = e.target.result;
            container.appendChild(img);
        }
        reader.readAsDataURL(file);
    }
}

// حفظ التواريخ
function setDate(type, value) {
    document.getElementById(type).innerText = value;
}

</script>

</body>
</html>
