<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARA ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #ff4d6d;
            --card-bg: rgba(255, 255, 255, 0.1);
            --bg-color: #0f0c29;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            text-align: center;
        }

        /* شاشة التحميل والكلمة السرية */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0c29; display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: 1s;
        }

        .login-card {
            background: var(--card-bg); padding: 30px; border-radius: 25px;
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2);
            width: 80%; max-width: 350px;
        }

        input {
            width: 80%; padding: 12px; border-radius: 10px; border: none;
            margin: 15px 0; font-size: 1.2rem; text-align: center;
        }

        /* المحتوى الرئيسي */
        #main-content { display: none; padding-top: 50px; }

        .love-header { font-size: 2.5rem; margin-bottom: 10px; }
        
        /* العداد الزمني الاحترافي */
        .timer-container {
            display: flex; justify-content: center; gap: 15px; margin: 20px 0;
        }
        .time-box {
            background: var(--card-bg); padding: 10px; border-radius: 12px;
            min-width: 60px; border: 1px solid var(--accent-color);
        }
        .time-box span { display: block; font-size: 1.5rem; font-weight: bold; }

        /* كروت المهام (كما في الفيديو) */
        .cards-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            padding: 20px; max-width: 500px; margin: 0 auto;
        }

        .card {
            background: var(--card-bg); height: 150px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; cursor: pointer; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .card.locked::after {
            content: '🔒'; position: absolute; font-size: 1.5rem;
        }
        .card.open { background: var(--accent-color); }

        /* قسم الصور */
        .photo-section img {
            width: 90%; border-radius: 20px; margin: 15px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* القلوب المتساقطة */
        .heart {
            position: fixed; top: -10%; font-size: 20px;
            animation: fall linear forwards; z-index: -1;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .hidden { display: none; }
        .visible { display: block; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="login-card">
            <div style="font-size: 40px;">🤔</div>
            <h3>جاهزة؟</h3>
            <p>كل اللي هنا هيفضل بيني وبينك طول العمر</p>
            <input type="password" id="pass" placeholder="l o v e">
            <button onclick="unlock()" style="background:var(--accent-color); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">يلا بسرعة افتحي 😍</button>
        </div>
    </div>

    <div id="main-content">
        <div class="love-header">SARA ❤️</div>
        <p>يوم ما عرفنا بعض كان يوم ولادتي</p>

        <div class="time-box" style="width: fit-content; margin: 0 auto 20px; padding: 15px 30px;">
            <div style="color: var(--accent-color);">💍 يوم خطوبتنا</div>
            <div style="font-size: 1.2rem;">2021-04-04</div>
        </div>

        <div class="time-box" style="width: fit-content; margin: 0 auto 20px; padding: 15px 30px;">
            <div style="color: var(--accent-color);">🤵 يوم فرحنا</div>
            <div style="font-size: 1.2rem;">2026-07-20</div> </div>

        <h3>بداية عمري معاكي بقالنا:</h3>
        <div class="timer-container">
            <div class="time-box"><span id="d">0</span>سنة</div>
            <div class="time-box"><span id="m">0</span>شهر</div>
            <div class="time-box"><span id="day">0</span>يوم</div>
        </div>

        <p>اقفي هنا شوية متجريش 😂❤️</p>

        <div class="cards-grid">
            <div class="card" onclick="openCard(this, 'بحبك يا نور عيني')">❤️<br>الأول</div>
            <div class="card" onclick="openCard(this, 'بموت فيكي يا أغلى ما عندي')">❤️<br>الثاني</div>
            <div class="card" onclick="openCard(this, 'حياتي باختصار هي إنتي')">❤️<br>الثالث</div>
            <div class="card" onclick="openCard(this, 'ربنا يخليكي ليا يا روحي')">❤️<br>الرابع</div>
        </div>

        <div id="card-message" style="margin: 20px; color: var(--accent-color); font-weight: bold; font-size: 1.3rem;"></div>

        <div class="photo-section">
            <p>أجمل لحظاتنا 👇</p>
            <img src="https://via.placeholder.com/400x500/ff4d6d/ffffff?text=Your+Photo+1" alt="صورة 1">
            <img src="https://via.placeholder.com/400x500/302b63/ffffff?text=Your+Photo+2" alt="صورة 2">
        </div>

        <div style="padding: 40px; opacity: 0.7;">
            Designed with love for SARA ❤️
        </div>
    </div>

    <script>
        // دالة الدخول
        function unlock() {
            const p = document.getElementById('pass').value;
            if(p.toLowerCase() === "love") {
                document.getElementById('lock-screen').style.opacity = "0";
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = "none";
                    document.getElementById('main-content').classList.add('visible');
                    startCounter();
                    makeHearts();
                }, 1000);
            } else {
                alert("كلمة السر هي love يا روحي 😂");
            }
        }

        // عداد الوقت (تاريخ البداية)
        function startCounter() {
            const start = new Date("April 4, 2021").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = now - start;
                
                const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
                const months = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30));
                const days = Math.floor((diff % (1000 * 60 * 60 * 24 * 30)) / (1000 * 60 * 60 * 24));

                document.getElementById('d').innerText = years;
                document.getElementById('m').innerText = months;
                document.getElementById('day').innerText = days;
            }, 1000);
        }

        // فتح الكروت
        function openCard(element, msg) {
            element.classList.add('open');
            element.innerHTML = "💖";
            document.getElementById('card-message').innerText = msg;
        }

        // تأثير القلوب
        function makeHearts() {
            setInterval(() => {
                const h = document.createElement('div');
                h.className = 'heart';
                h.innerHTML = ["❤️", "💖", "💗", "💕"][Math.floor(Math.random()*4)];
                h.style.left = Math.random() * 100 + "vw";
                h.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 5000);
            }, 400);
        }
    </script>
</body>
</html>
