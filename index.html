<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Medo & Dalia | قصة حبنا 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary-color: #ff0055;
      --glass-bg: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0f0f 0%, #000000 100%);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    /* شاشة تسجيل الدخول */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.8s ease;
    }

    .login-card {
      background: var(--glass-bg);
      padding: 40px 20px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.1);
      width: 85%;
      max-width: 350px;
    }

    .login-card input {
      width: 100%;
      padding: 15px;
      margin: 20px 0;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      text-align: center;
      font-size: 18px;
    }

    .login-card button {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: var(--primary-color);
      color: white;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    /* المحتوى الرئيسي */
    #main-content {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
      padding-bottom: 50px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    .header-title { font-size: 28px; margin: 20px 0; color: var(--primary-color); }

    /* خانة الرسالة */
    .message-box {
      background: var(--glass-bg);
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .message-box textarea {
      width: 100%;
      height: 100px;
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      resize: none;
      text-align: center;
      outline: none;
    }

    /* الفيديوهات والصور */
    .media-card {
      background: var(--glass-bg);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .media-card h3 { font-size: 16px; padding: 10px; margin: 0; background: rgba(0,0,0,0.3); }

    video, img {
      width: 100%;
      display: block;
      background: #000;
    }

    .heart {
      font-size: 50px;
      animation: pulse 1.5s infinite;
      margin: 20px 0;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    audio { margin: 20px 0; width: 100%; filter: invert(1); }
  </style>
</head>
<body>

<div id="lock-screen">
  <div class="login-card">
    <div style="font-size: 50px; margin-bottom: 10px;">🔐</div>
    <h2>Medo & Dalia</h2>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة السر..">
    <button onclick="checkPassword()">دخول</button>
  </div>
</div>

    </audio>

    <div class="heart">💖</div>

    </div>
