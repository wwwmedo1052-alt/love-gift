<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Medo & Dalia | قصة حبنا 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary-color: #e75480;
      --glass-bg: rgba(255, 255, 255, 0.15);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #2c1e1e 0%, #121212 100%);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    /* شاشة كلمة السر */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.8s ease;
    }

    .login-card {
      background: var(--glass-bg);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      width: 85%;
      max-width: 350px;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: #fff;
      text-align: center;
      outline: none;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ff0055;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* محتوى الصفحة الرئيسي */
    #main-content {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
      padding: 20px;
    }

    .video-container {
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 20px auto;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .video-container h3 {
      padding: 15px;
      margin: 0;
      background: rgba(0,0,0,0.4);
      color: #ffda79;
    }

    video {
      width: 100%;
      display: block;
    }

    .heart {
      font-size: 50px;
      animation: pulse 1.5s infinite;
      color: #ff0055;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="lock-screen">
  <div class="login-card">
    <h2>Medo & Dalia</h2>
    <input type="password" id="passwordInput" placeholder="كلمة السر..">
    <button onclick="checkPassword()">دخول</button>
    <p id="error-msg" style="color: #ffda79; display: none; margin-top: 10px;">كلمة السر غلط! ❌</p>
  </div>
</div>

<div id="main-content">
  <audio id="bgMusic" loop>
    <source src="http://googleusercontent.com/file_content/1" type="audio/mpeg">
  </audio>

  <h1>إلى أغلى إنسانة 💕</h1>
  <div class="heart">❤️</div>
  
  <div class="video-container">
    <h3>احلي كتكوته</h3>
    <video id="myVideo" controls playsinline>
      <source src="http://googleusercontent.com/file_content/0" type="video/mp4">
      متصفحك لا يدعم الفيديو.
    </video>
  </div>

  <p>أنتِ أجمل حاجة حصلت في حياتي 🤍</p>
</div>

<script>
  function checkPassword() {
    const pass = document.getElementById('passwordInput').value;
    const music = document.getElementById('bgMusic');
    const video = document.getElementById('myVideo');

    if (pass === "762003") {
      document.getElementById('lock-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        setTimeout(() => {
          document.getElementById('main-content').style.opacity = '1';
          music.play(); // تشغيل الأغنية
          video.play(); // تشغيل الفيديو تلقائياً عند الدخول
        }, 50);
      }, 800);
    } else {
      document.getElementById('error-msg').style.display = 'block';
    }
  }
</script>

</body>
</html>
