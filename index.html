<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إهداء خاص 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    .section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 1.5s ease;
    }

    h1, h2 {
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      max-width: 600px;
      line-height: 1.8;
    }

    .heart {
      font-size: 60px;
      animation: pulse 1.5s infinite;
      margin: 20px 0;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* شاشة اللمسة */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .overlay button {
      background: #fff;
      color: #e75480;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 40px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- الموسيقى -->
<audio id="bgMusic" loop>
  <source src="Albumaty.Com_amrw_dyab_hbیbty_mlak.mp3" type="audio/mpeg">
</audio>

<!-- شاشة اللمسة -->
<div class="overlay" id="overlay">
  <button onclick="startMusic()">💖 إلمسي هنا</button>
</div>

<div class="section">
  <h1>إلى أغلى إنسان في حياتي 💕</h1>
  <div class="heart">❤️</div>
  <p>
    الصفحة دي معمولة مخصوص علشانك…
    علشان أقولك إنك نعمة كبيرة في حياتي
    وإن وجودك فارق معايا أكتر ما تتخيل 🤍
  </p>
</div>

<div class="section">
  <h2>عارفة إيه أكتر حاجة؟</h2>
  <div class="heart">💞</div>
  <p>
    إنك دايمًا السبب في ابتسامتي،
    وفي أي وقت بكون محتاج أمان
    بلاقيك إنت 🤍
  </p>
</div>

<div class="section">
  <h2>رسالة من قلبي
