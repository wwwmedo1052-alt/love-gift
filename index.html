<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mido & Dina - حبيبتي ملاك</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.1);
            --accent-color: #ff0055;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #2c1e1e 0%, #121212 100%);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .heart-icon {
            color: var(--accent-color);
            font-size: 24px;
        }

        /* العداد الزمني */
        .timer-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .timer-box {
            background: var(--card-bg);
            padding: 15px 5px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .timer-num {
            font-size: 22px;
            font-weight: bold;
            display: block;
        }

        .timer-label {
            font-size: 12px;
            opacity: 0.8;
        }

        /* مشغل الصوت */
        .audio-player {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255,0,85,0.3);
        }

        .song-info {
            margin-bottom: 15px;
        }

        .song-title {
            font-size: 16px;
            font-weight: bold;
            display: block;
            color: var(--accent-color);
        }

        .artist-name {
            font-size: 12px;
            opacity: 0.7;
        }

        audio {
            width: 100%;
            height: 40px;
            filter: invert(1) hue-rotate(180deg); /* تحسين شكل المشغل ليناسب التصميم */
        }

        /* قسم الذكريات */
        .memories-grid {
            width: 100%;
            max-width: 400px;
        }

        .memory-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .memory-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .memory-info {
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .memory-date {
            font-size: 10px;
            background: var(--accent-color);
            padding: 2px 8px;
            border-radius: 5px;
            float: left;
        }

        .memory-title {
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        .quote-card {
            background: linear-gradient(45deg, #4b001a, #80002a);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            line-height: 1.8;
            margin-top: 10px;
            font-style: italic;
            border: 1px solid rgba(255,255,255,0.1);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>❤️ Mido & Dina</h1>
    </div>

    <div class="timer-container">
        <div class="timer-box"><span class="timer-num">00</span><span class="timer-label">سنة</span></div>
        <div class="timer-box"><span class="timer-num">11</span><span class="timer-label">شهر</span></div>
        <div class="timer-box"><span class="timer-num">29</span><span class="timer-label">يوم</span></div>
        <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
    </div>

    <div class="audio-player">
        <div class="song-info">
            <span class="song-title">🎵 حبيبتي ملاك</span>
            <span class="artist-name">عمرو دياب</span>
        </div>
        <audio controls>
            <source src="http://googleusercontent.com/file_content/0" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت.
        </audio>
    </div>

    <div class="memories-grid">
        <div class="memory-card">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=400" alt="ذكرى">
            <div class="memory-info">
                <span class="memory-date">2025-01-01</span>
                <span class="memory-title">أول مقابلة</span>
                <small>اليوم الذي بدأت فيه قصتنا</small>
            </div>
        </div>

        <div class="quote-card">
            "أنا وهي وزيها مين.. دي أجمل حاجة في الدنيا تشوفها العين.. حبيبتي اللحظة في وجودها تساوي سنين."
        </div>
    </div>

    <script>
        // تحديث الثواني بشكل حي
        setInterval(() => {
            const secElement = document.getElementById('seconds');
            let currentSec = parseInt(secElement.innerText);
            currentSec = (currentSec + 1) % 60;
            secElement.innerText = currentSec.toString().padStart(2, '0');
        }, 1000);
    </script>

</body>
</html>
