<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARA & AHMED ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff2d55;
            --purple: #1a1a2e;
            --dark: #0f0c29;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 1. شاشة التحميل الوردية (مثل الفيديو) */
        #loader {
            position: fixed; inset: 0;
            background: #24243e;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000;
        }
        .loading-circle {
            width: 80px; height: 80px;
            border: 5px solid rgba(255,45,85,0.2);
            border-top: 5px solid var(--pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 2. شاشة القفل */
        #lock-screen {
            position: fixed; inset: 0;
            background: rgba(15, 12, 41, 0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; text-align: center; backdrop-filter: blur(10px);
        }
        .lock-card {
            background: rgba(255,255,255,0.1); padding: 30px;
            border-radius: 25px; border: 1px solid rgba(255,45,85,0.3);
            width: 90%; max-width: 350px;
        }
        input {
            width: 80%; padding: 12px; border-radius: 12px; border: none;
            margin: 20px 0; text-align: center; font-size: 1.2rem;
            outline: none; box-shadow: 0 0 15px rgba(255,45,85,0.2);
        }

        /* 3. المحتوى الرئيسي */
        #main-content { display: none; padding: 20px; text-align: center; }

        .header-title { font-size: 2.5rem; margin-top: 20px; letter-spacing: 2px; }
        .sub-text { opacity: 0.8; margin-bottom: 30px; }

        /* العداد (سنين - شهور - أيام) */
        .timer-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px auto;
            max-width: 400px;
        }
        .timer-box {
            background: rgba(255,255,255,0.05); padding: 15px;
            border-radius: 15px; border: 1px solid rgba(255,45,85,0.3);
        }
        .timer-box b { display: block; font-size: 1.5rem; color: var(--pink); }

        /* الكروت التفاعلية (أهم جزء في الفيديو) */
        .cards-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            max-width: 400px; margin: 30px auto;
        }
        .card {
            background: rgba(255,255,255,0.08); height: 120px;
            border-radius: 20px; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .card.active { background: var(--pink); transform: scale(0.95); }
        .card i { font-size: 1.5rem; margin-bottom: 5px; }

        /* القلوب */
        .heart {
            position: fixed; top: -20px; color: var(--pink);
            pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 10001;
        }
        .modal-content {
            background: #302b63; padding: 30px; border-radius: 20px;
            width: 80%; max-width: 300px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loading-circle"></div>
        <p style="margin-top: 20px; color: var(--pink);">جاري التحميل ياروحي معلش ✨</p>
    </div>

    <div id="lock-screen">
        <div class="lock-card">
            <h2 style="margin-bottom:10px;">🤔 جاهزة؟</h2>
            <p style="font-size: 0.9rem;">كل اللي هنا هيفضل بيني وبينك طول العمر</p>
            <input type="password" id="passInput" placeholder="l o v e">
            <button onclick="unlock()" style="background:var(--pink); color:white; border:none; padding:10px 25px; border-radius:10px; cursor:pointer; width:100%;">يلا بسرعة افتحي 😍</button>
        </div>
    </div>

    <div id="main-content">
        <h1 class="header-title">SARA ❤️</h1>
        <p class="sub-text">يوم ما عرفنا بعض كان يوم ولادتي</p>

        <div class="timer-box" style="margin: 0 auto 20px; max-width: 300px;">
            <p>💍 يوم خطوبتنا</p>
            <b>2021-04-04</b>
        </div>

        <h3 style="margin-bottom: 10px;">بداية عمري معاكي بقالنا:</h3>
        <div class="timer-grid">
            <div class="timer-box"><b id="y">0</b>سنة</div>
            <div class="timer-box"><b id="m">0</b>شهر</div>
            <div class="timer-box"><b id="d">0</b>يوم</div>
        </div>

        <p style="margin-top: 30px;">اقفي هنا شوية متجريش 😂❤️</p>
        <div class="cards-container">
            <div class="card" onclick="showMsg('بحبك يا نور عيني')">❤️<br>الأول</div>
            <div class="card" onclick="showMsg('بموت فيكي يا أغلى ما عندي')">❤️<br>الثاني</div>
            <div class="card" onclick="showMsg('حياتي باختصار هي إنتي')">❤️<br>الثالث</div>
            <div class="card" onclick="showMsg('ربنا يخليكي ليا يا روحي')">❤️<br>الرابع</div>
        </div>

        <div style="margin-top: 40px; padding-bottom: 50px;">
            <p>أجمل صورنا 👇</p>
            <img src="https://via.placeholder.com/350x450" style="width:90%; border-radius:20px; margin-top:15px; border: 2px solid var(--pink);">
        </div>
    </div>

    <div id="modal" class="modal" onclick="this.style.display='none'">
        <div class="modal-content">
            <p id="modal-text"></p>
            <button style="margin-top:20px; background:var(--pink); border:none; color:white; padding:5px 15px; border-radius:5px;">إغلاق</button>
        </div>
    </div>

    <script>
        // 1. إخفاء التحميل وإظهار القفل
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('lock-screen').style.display = 'flex';
        }, 3000);

        // 2. فتح الموقع
        function unlock() {
            const p = document.getElementById('passInput').value;
            if(p.toLowerCase() === "love") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                startTimer();
                setInterval(createHeart, 300);
            } else {
                alert("كلمة السر هي love ياروحي 😂");
            }
        }

        // 3. عداد الوقت (من 4-4-2021)
        function startTimer() {
            const start = new Date("2021-04-04");
            setInterval(() => {
                const now = new Date();
                let years = now.getFullYear() - start.getFullYear();
                let months = now.getMonth() - start.getMonth();
                let days = now.getDate() - start.getDate();

                if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
                if (months < 0) { years--; months += 12; }

                document.getElementById('y').innerText = years;
                document.getElementById('m').innerText = months;
                document.getElementById('d').innerText = days;
            }, 1000);
        }

        // 4. عرض الرسائل من الكروت
        function showMsg(text) {
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal').style.display = 'flex';
        }

        // 5. القلوب المتساقطة
        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 20 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }
    </script>
</body>
</html>
